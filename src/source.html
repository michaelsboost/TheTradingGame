<div class="min-h-screen max-w-7xl mx-auto p-4 flex flex-col gap-6">
  <!-- Header with Performance Button -->
  <div class="flex flex-row justify-between items-center">
    <a class="no-underline" href="https://github.com/michaelsboost/TheTradingGame/" target="_blank">
    <h1 class="text-3xl font-bold flex items-center gap-2">
      
      <svg class="h-12" xmlns="http://www.w3.org/2000/svg" style="isolation:isolate" viewBox="0 0 128 128" fill="currentColor">
        <g>
          <circle cx="64" cy="63.99999999999992" r="7.367346938775501"/>
          <path d=" M 23.695 23.695 Q 43.436 3.954 54.404 54.404 Q 3.954 43.436 23.695 23.695 Z "/>
          <path d=" M 104.305 104.305 Q 124.046 84.564 73.596 73.596 Q 84.564 124.046 104.305 104.305 Z "/>
          <path d=" M 23.695 104.305 Q 43.436 124.046 54.404 73.596 Q 3.954 84.564 23.695 104.305 Z "/>
          <path d=" M 104.305 23.695 Q 124.046 43.436 73.596 54.404 Q 84.564 3.954 104.305 23.695 Z "/>
          <path d=" M 121 64 Q 121 91.918 77.571 64 Q 121 36.082 121 64 Z "/>
          <path d=" M 7 64 Q 7 91.918 50.429 64 Q 7 36.082 7 64 Z "/>
          <path d=" M 64 121 Q 91.918 121 64 77.571 Q 36.082 121 64 121 Z "/>
          <path d=" M 64 7 Q 91.918 7 64 50.429 Q 36.082 7 64 7 Z "/>
        </g>
      </svg>
      
      <span class="arvo-bold gradient-text">The Trading Game</span>
    </h1>
    <p class="text-sm text-slate-400 mt-1">Start with $1,000. Trade your way to the top.</p>
  </a>

    <!-- Performance Button -->
    <button id="performance" class="bg-transparent border-0 shadow-none">
      <svg class="w-12 h-12 trading-card transition hover:border-white text-green-400" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="3">
        <!-- Line path -->
        <path
          id="chart-line"
          d="M8 48 L20 32 L32 40 L44 20 L56 28"
          stroke="currentColor"
          stroke-linejoin="round"
          fill="none"
          stroke-dasharray="100"
          stroke-dashoffset="100">
          <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.4s" fill="freeze" />
        </path>
      
        <!-- Circles on data points including the start -->
        <circle cx="8" cy="48" r="2">
          <animate attributeName="r" from="0" to="2" dur="0.5s" begin="0.2s" fill="freeze" />
        </circle>
        <circle cx="20" cy="32" r="2">
          <animate attributeName="r" from="0" to="2" dur="0.5s" begin="0.5s" fill="freeze" />
        </circle>
        <circle cx="32" cy="40" r="2">
          <animate attributeName="r" from="0" to="2" dur="0.5s" begin="0.8s" fill="freeze" />
        </circle>
        <circle cx="44" cy="20" r="2">
          <animate attributeName="r" from="0" to="2" dur="0.5s" begin="1.1s" fill="freeze" />
        </circle>
        <circle cx="56" cy="28" r="2">
          <animate attributeName="r" from="0" to="2" dur="0.5s" begin="1.4s" fill="freeze" />
        </circle>
      </svg>
    </button>
  </div>

  <!-- Main Trading Interface -->
  <div class="grid grid-cols-1 gap-6">
    <!-- Chart Column -->
    <div class="trading-card rounded-xl p-5">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-lg my-auto">Price Chart</h2>
        <!-- Balance Button -->
        <button data-active="false" id="balance" class="flex items-center bg-[var(--bg-body)] border-2 border-cyan-900 rounded-full px-4 py-3">
          <svg class="w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <path fill="currentColor" d="M200 168a48.05 48.05 0 0 1-48 48h-16v16a8 8 0 0 1-16 0v-16h-16a48.05 48.05 0 0 1-48-48a8 8 0 0 1 16 0a32 32 0 0 0 32 32h48a32 32 0 0 0 0-64h-40a48 48 0 0 1 0-96h8V24a8 8 0 0 1 16 0v16h8a48.05 48.05 0 0 1 48 48a8 8 0 0 1-16 0a32 32 0 0 0-32-32h-32a32 32 0 0 0 0 64h40a48.05 48.05 0 0 1 48 48"/>
          </svg>
          <!-- active balance -->
          <span class="px-2">1,000</span>
        </button>
      </div>
      
      <!-- Chart Canvas -->
      <div class="relative">
        <canvas id="chart" class="w-full h-[400px]"></canvas>
        <div id="tradeMessage" class="text-sm text-red-400 mt-2 h-5"></div>
      </div>
      
      <!-- Trading Controls -->
      <footer class="flex-shrink flex justify-between p-4 gap-4 overflow-x-auto">
        <!-- buy button -->
        <button data-active="false" id="buy" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 border-0">
          <svg class="w-4" xmlns="http://www.w3.org/2000/svg" style="isolation:isolate" viewBox="0 0 256 256" fill="currentColor"><path d="M 0 168.381 L 66.301 102.065 C 73.447 94.894 85.06 94.894 92.206 102.065 L 128 137.905 L 193.524 72.381 L 176.762 72.381 C 166.663 72.381 158.476 64.194 158.476 54.095 C 158.476 43.996 166.663 35.81 176.762 35.81 L 237.714 35.81 C 247.813 35.81 256 43.996 256 54.095 L 256 115.048 C 256 125.147 247.813 133.333 237.714 133.333 C 227.615 133.333 219.429 125.147 219.429 115.048 L 219.429 98.286 L 140.937 176.792 C 133.791 183.963 122.179 183.963 115.032 176.792 L 79.238 140.952 L 0 220.19"/></svg>
        </button>
        <!-- wager button -->
        <button data-active="false" id="wager" class="flex items-center bg-[var(--bg-body)] border-0 rounded-full px-3">100</button>
        <!-- duration -->
        <button data-active="false" id="duration" class="flex items-center bg-[var(--bg-body)] border-0 rounded-full px-2">
          <!-- hour duration -->
          <span id="durH" class="px-2">00h:</span>
          <!-- minute duration -->
          <span id="durM" class="px-2">00m:</span>
          <!-- second duration -->
          <span id="durS" class="px-2">05s</span>
        </button>
        <!-- sell button -->
        <button data-active="false" id="sell" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 border-0">
          <svg class="w-4" xmlns="http://www.w3.org/2000/svg" style="isolation:isolate" viewBox="0 0 256 256" fill="currentColor"><path d="M 0 87.619 L 66.301 153.935 C 73.447 161.106 85.06 161.106 92.206 153.935 L 128 118.095 L 193.524 183.619 L 176.762 183.619 C 166.663 183.619 158.476 191.806 158.476 201.905 C 158.476 212.004 166.663 220.19 176.762 220.19 L 237.714 220.19 C 247.813 220.19 256 212.004 256 201.905 L 256 140.952 C 256 130.853 247.813 122.667 237.714 122.667 C 227.615 122.667 219.429 130.853 219.429 140.952 L 219.429 157.714 L 140.937 79.208 C 133.791 72.037 122.179 72.037 115.032 79.208 L 79.238 115.048 L 0 35.81"/></svg>
        </button>
      </footer>
    </div>
  </div>
  
  <!-- Trade History -->
  <div class="trading-card rounded-xl p-5 mt-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-bold text-lg">📋 Trade History</h2>
      <div class="flex gap-4">
        <div class="text-sm">
          <span class="text-slate-400">Total Trades:</span>
          <span id="totalTrades" class="font-bold ml-2">0</span>
        </div>
        <div class="text-sm">
          <span class="text-slate-400">Profitability:</span>
          <span id="winlossratio" class="font-bold ml-2">0%</span>
        </div>
      </div>
    </div>
    
    <div class="overflow-x-auto">
      <table id="history" class="w-full text-sm">
        <thead>
          <tr class="text-left border-b border-slate-700">
            <th class="pb-2 text-slate-400">Time</th>
            <th class="pb-2 text-slate-400">Type</th>
            <th class="pb-2 text-slate-400">Entry</th>
            <th class="pb-2 text-slate-400">Exit</th>
            <th class="pb-2 text-slate-400">P&L</th>
            <th class="pb-2 text-slate-400">Duration</th>
            <th class="pb-2 text-slate-400">Result</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-700">
          <tr>
            <td colspan="8" class="py-8 text-center text-slate-500">No trades yet</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
