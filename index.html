<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingView Chart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #14152f;
    }
    .tradingview-widget-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #tradingview_0b60e {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="tradingview-widget-container">
    <div id="tradingview_0b60e"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
      // Initialize TradingView widget (moved from script.js)
      function initTradingViewWidget() {
        const urlParams = new URLSearchParams(window.location.search);
        const market = urlParams.get('market') || 'BTCUSD'; // Default to BTCUSD

        const marketSymbols = {
          'BTCUSD': 'COINBASE:BTCUSD',
          'ETHUSD': 'COINBASE:ETHUSD',
          'XRPUSD': 'COINBASE:XRPUSD',
          'ADAUSD': 'COINBASE:ADAUSD',
          'DJIA': 'FOREXCOM:DJI',
          'Nasdaq': 'NASDAQ:NDX',
          'SP500': 'FOREXCOM:SPX',
          'EURUSD': 'FOREXCOM:EURUSD',
          'GBPUSD': 'FOREXCOM:GBPUSD',
          'USDJPY': 'FOREXCOM:USDJPY',
          'AUDUSD': 'FOREXCOM:AUDUSD',
          'USDCAD': 'FOREXCOM:USDCAD',
          'XAUUSD': 'FOREXCOM:XAUUSD',
          'WTI': 'TVC:USOIL',
          'XAGUSD': 'FOREXCOM:XAGUSD'
        };

        const widgetConfig = {
          "width": "100%",
          "height": "100%",
          "symbol": marketSymbols[market] || "COINBASE:BTCUSD", // Use market from URL
          "interval": "1",
          "timezone": "Asia/Kuala_Lumpur",
          "theme": "dark",
          "style": "1",
          "locale": "en",
          "toolbar_bg": "#f1f3f6",
          "enable_publishing": false,
          "withdateranges": true,
          "hide_side_toolbar": false,
          "allow_symbol_change": true,
          "details": true,
          "hotlist": true,
          "calendar": false,
          "studies": [
            "STD;Average%1Directional%1Index",
            "STD;MACD"
          ],
          "container_id": "tradingview_0b60e",
          "show_popup_button": true,
          "popup_width": "1000",
          "popup_height": "650"
        };

        new TradingView.widget(widgetConfig);
      }

      document.addEventListener('DOMContentLoaded', initTradingViewWidget);
    </script>
  </div>
</body>
</html>
