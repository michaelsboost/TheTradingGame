<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>The Trading Game - Choose Your Market</title>
    <!-- Tailwind CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <!-- AOS for animations -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        color: white;
      }
      
      .bg-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('../imgs/background.png') center center / cover no-repeat;
        z-index: -2;
      }

      .content-wrapper {
        background-color: rgba(26, 32, 44, 0.85);
        min-height: 100vh;
        z-index: 1;
      }

      /* Main title styling */
      .main-title {
        font-family: 'Anton', sans-serif;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: linear-gradient(to right, #fff 20%, #ddd 40%, #fff 60%, #ddd 80%);
        background-size: 200% auto;
        color: #000;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 3s linear infinite;
      }

      /* Card style with blue gradient and hover effect */
      .card {
        background: linear-gradient(90deg, #005999, #126cab);
        color: white;
        position: relative;
        overflow: hidden;
        border-radius: 0.5rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        width: 280px;
        margin: 0 auto;
      }
      
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
        filter: brightness(1.1);
      }

      .card::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url('https://www.transparenttextures.com/patterns/black-linen.png');
        opacity: 0.1;
        transform: rotate(45deg);
      }

      .card-content {
        position: relative;
        z-index: 10;
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
      }

      /* Section title styling with shine effect */
      .title-3d {
        font-family: 'Orbitron', sans-serif;
        text-transform: uppercase;
        letter-spacing: 3px;
        color: white;
        text-shadow: 
          0 1px 0 #ccc,
          0 2px 0 #c9c9c9,
          0 3px 0 #bbb,
          0 4px 0 #b9b9b9,
          0 5px 0 #aaa,
          0 6px 1px rgba(0,0,0,.1),
          0 0 5px rgba(0,0,0,.1),
          0 1px 3px rgba(0,0,0,.3),
          0 3px 5px rgba(0,0,0,.2),
          0 5px 10px rgba(0,0,0,.25),
          0 10px 10px rgba(0,0,0,.2),
          0 20px 20px rgba(0,0,0,.15);
        background: linear-gradient(to right, #ffffff 20%, #999999 40%, #ffffff 60%, #999999 80%);
        background-size: 200% auto;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s linear infinite;
      }

      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0px);
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-image"></div>
    <div class="content-wrapper">
      <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="py-6 text-center" data-aos="fade-down">
          <img src="../imgs/icon.png" alt="The Trading Game Icon" class="w-48 h-48 mx-auto mb-4" />
          <h1 class="text-6xl md:text-7xl font-bold mb-3 main-title">The Trading Game</h1>
          <p class="text-xl md:text-2xl text-white opacity-90">
            Test your skill with zero money
          </p>
        </header>
        <!-- Main Content -->
        <main class="flex-grow px-4 md:px-10 container mx-auto max-w-5xl">
          <!-- Equity Indices Section -->
          <section class="mb-12" data-aos="fade-up">
            <h2 class="text-3xl font-semibold mb-6 text-center title-3d">Equity Indices</h2>
            <div class="space-y-4 flex flex-col items-center">
              <button
                onclick="navigateToChart('DJIA')"
                class="card"
              >
                <span class="card-content">Dow Jones 30</span>
              </button>
              <button
                onclick="navigateToChart('Nasdaq')"
                class="card"
              >
                <span class="card-content">Nasdaq 100</span>
              </button>
              <button
                onclick="navigateToChart('SP500')"
                class="card"
              >
                <span class="card-content">S&amp;P 500 Index</span>
              </button>
            </div>
          </section>
          <!-- Forex Section -->
          <section class="mb-12" data-aos="fade-up" data-aos-delay="100">
            <h2 class="text-3xl font-semibold mb-6 text-center title-3d">Forex</h2>
            <div class="space-y-4 flex flex-col items-center">
              <button
                onclick="navigateToChart('EURUSD')"
                class="card"
              >
                <span class="card-content">EUR/USD</span>
              </button>
              <button
                onclick="navigateToChart('GBPUSD')"
                class="card"
              >
                <span class="card-content">GBP/USD</span>
              </button>
              <button
                onclick="navigateToChart('USDJPY')"
                class="card"
              >
                <span class="card-content">USD/JPY</span>
              </button>
              <button
                onclick="navigateToChart('AUDUSD')"
                class="card"
              >
                <span class="card-content">AUD/USD</span>
              </button>
              <button
                onclick="navigateToChart('USDCAD')"
                class="card"
              >
                <span class="card-content">USD/CAD</span>
              </button>
            </div>
          </section>
          <!-- Commodities Section -->
          <section class="mb-12" data-aos="fade-up" data-aos-delay="200">
            <h2 class="text-3xl font-semibold mb-6 text-center title-3d">Commodities</h2>
            <div class="space-y-4 flex flex-col items-center">
              <button
                onclick="navigateToChart('XAUUSD')"
                class="card"
              >
                <span class="card-content">Gold (XAU/USD)</span>
              </button>
              <button
                onclick="navigateToChart('XAGUSD')"
                class="card"
              >
                <span class="card-content">Silver (XAG/USD)</span>
              </button>
              <button
                onclick="navigateToChart('WTI')"
                class="card"
              >
                <span class="card-content">WTI Crude Oil</span>
              </button>
            </div>
          </section>
          <!-- Cryptocurrencies Section -->
          <section class="mb-12" data-aos="fade-up" data-aos-delay="300">
            <h2 class="text-3xl font-semibold mb-6 text-center title-3d">Cryptocurrencies</h2>
            <div class="space-y-4 flex flex-col items-center">
              <button
                onclick="navigateToChart('BTCUSD')"
                class="card"
              >
                <span class="card-content">Bitcoin (BTC/USD)</span>
              </button>
              <button
                onclick="navigateToChart('ETHUSD')"
                class="card"
              >
                <span class="card-content">Ethereum (ETH/USD)</span>
              </button>
              <button
                onclick="navigateToChart('XRPUSD')"
                class="card"
              >
                <span class="card-content">Ripple (XRP/USD)</span>
              </button>
              <button
                onclick="navigateToChart('ADAUSD')"
                class="card"
              >
                <span class="card-content">Cardano (ADA/USD)</span>
              </button>
            </div>
          </section>
        </main>
        <!-- Footer -->
        <footer class="py-6 text-center text-white" data-aos="fade-up">
          <p class="text-sm opacity-90">
            &copy; 2023 The Trading Game. All rights reserved.
          </p>
        </footer>
      </div>
    </div>
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init({ 
        duration: 800,
        once: true
      });
      
      function navigateToChart(market) {
        window.location.href = `index.html?market=${market}`;
      }
    </script>
  </body>
</html>
