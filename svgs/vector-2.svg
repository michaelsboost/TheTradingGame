<svg class="w-12 h-12 trading-card transition hover:border-white text-green-400" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="3">
        <!-- Line path -->
        <path id="chart-line" d="M8 48 L20 32 L32 40 L44 20 L56 28" stroke="currentColor" stroke-linejoin="round" fill="none" stroke-dasharray="100" stroke-dashoffset="100">
          <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.4s" fill="freeze"></animate>
        </path>
      
        <!-- Circles on data points including the start -->
        <circle cx="8" cy="48" r="2">
          <animate attributeName="r" from="0" to="2" dur="0.5s" begin="0.2s" fill="freeze"></animate>
        </circle>
        <circle cx="20" cy="32" r="2">
          <animate attributeName="r" from="0" to="2" dur="0.5s" begin="0.5s" fill="freeze"></animate>
        </circle>
        <circle cx="32" cy="40" r="2">
          <animate attributeName="r" from="0" to="2" dur="0.5s" begin="0.8s" fill="freeze"></animate>
        </circle>
        <circle cx="44" cy="20" r="2">
          <animate attributeName="r" from="0" to="2" dur="0.5s" begin="1.1s" fill="freeze"></animate>
        </circle>
        <circle cx="56" cy="28" r="2">
          <animate attributeName="r" from="0" to="2" dur="0.5s" begin="1.4s" fill="freeze"></animate>
        </circle>
      </svg>